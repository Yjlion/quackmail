# QuackCit server configuration, sourced by quackcit.sh and quackcitadm.sh.
#
# Copy this file, edit it, and point the scripts at it:
#     QUACKCIT_CONF=/etc/quackcit.conf deploy/quackcit.sh start
#
# Every assignment uses `: "${VAR:=value}"`, so a value already in the
# environment wins over the one here. That makes one-off overrides work:
#     QUACKCIT_PORT_SMTP_IN=25 deploy/quackcit.sh start
#
# The scripts export everything set here, so anything run_quackcit.py
# understands can be added below.

# ---- paths ----------------------------------------------------------------

# The DuckDB file holding every user, room and message. Back this up.
# : "${QUACKCIT_DB:=/var/lib/quackcit/quackcit.duckdb}"

# Where the built .duckdb_extension files live.
# : "${QUACKCIT_EXT_DIR:=/opt/quackcit/extension}"

# : "${QUACKCIT_LOG:=/var/log/quackcit.log}"
# : "${QUACKCIT_PIDFILE:=/run/quackcit.pid}"

# The admin control socket. quackcitadm.sh uses it to reach a running server,
# because DuckDB permits only one read-write process per database file. It
# accepts arbitrary SQL, so treat it as a root-equivalent control channel:
# it is created mode 0600, and must not live on a shared filesystem.
# : "${QUACKCIT_ADMIN_SOCK:=/run/quackcit.admin.sock}"

# ---- network --------------------------------------------------------------

# Default bind address for every listener.
: "${QUACKCIT_HOST:=127.0.0.1}"

# TLS material. Without both, implicit-TLS listeners are skipped and STARTTLS
# is not offered.
# : "${QUACKCIT_TLS_CERT:=/etc/ssl/certs/quackcit.pem}"
# : "${QUACKCIT_TLS_KEY:=/etc/ssl/private/quackcit.key}"

# ---- ports ----------------------------------------------------------------
#
# Defaults are the non-privileged dev ports, chosen so QuackCit can run beside
# a real Citadel server. Production values are in the trailing comments.

: "${QUACKCIT_PORT_CITADEL:=5040}"        # 504
: "${QUACKCIT_PORT_SMTP_IN:=2525}"        # 25
: "${QUACKCIT_PORT_SUBMISSION:=2587}"     # 587
: "${QUACKCIT_PORT_SMTPS:=2465}"          # 465
: "${QUACKCIT_PORT_POP3:=1110}"           # 110
: "${QUACKCIT_PORT_POP3S:=1995}"          # 995
: "${QUACKCIT_PORT_IMAP:=1143}"           # 143
: "${QUACKCIT_PORT_MANAGESIEVE:=4190}"    # 4190
: "${QUACKCIT_PORT_TELNET:=2300}"         # 23
: "${QUACKCIT_PORT_TELNETS:=2992}"        # 992
: "${QUACKCIT_PORT_NNTP:=1119}"           # 119
: "${QUACKCIT_PORT_NNTPS:=1563}"          # 563
: "${QUACKCIT_PORT_XMPP:=15222}"          # 5222
: "${QUACKCIT_PORT_XMPPS:=15223}"         # 5223

# The web interface (webmail, the BBS over the web, and the admin console).
# By default the plain listener only redirects to HTTPS; see the notes below.
: "${QUACKCIT_PORT_HTTP:=8080}"           # 80
: "${QUACKCIT_PORT_HTTPS:=8443}"          # 443

# LMTP does no authentication and no spam filtering by design — it is the
# trusted local-injection path. It binds to loopback regardless of
# QUACKCIT_HOST unless QUACKCIT_HOST_LMTP is set. Do not expose it.
: "${QUACKCIT_PORT_LMTP:=2033}"           # 24

# ---- which listeners to run -----------------------------------------------
#
# Set any of these to 0 to leave that service down.

# : "${QUACKCIT_ENABLE_XMPP:=0}"
# : "${QUACKCIT_ENABLE_NNTP:=0}"
# : "${QUACKCIT_ENABLE_TELNET:=0}"
# : "${QUACKCIT_ENABLE_HTTP:=0}"
# : "${QUACKCIT_ENABLE_HTTPS:=0}"

# ---- the web interface -----------------------------------------------------
#
# These are rows in citadel_config, not environment variables — set them with
# `quackcitadm.sh config set <name> <value>`:
#
#   qm_web_force_https       1  the plain listener 301s everything to
#                               https://<c_fqdn>. Set to 0 behind a reverse
#                               proxy, or on a dev box with no certificate.
#   qm_web_trusted_proxies   '' comma-separated CIDRs/globs. X-Forwarded-Proto
#                               is honoured only from a peer on this list;
#                               without it a client could simply claim TLS.
#   qm_web_hsts              0  send Strict-Transport-Security over TLS. Opt-in
#                               because a wrong HSTS header is sticky.
#   qm_web_origins           '' comma-separated host globs allowed to submit
#                               forms; defaults to c_fqdn.
#
# The admin console can set config, mint credentials and generate DKIM keys, so
# it is root-equivalent and ships turned off:
#
#   qm_web_admin_enabled     0  turn the console on
#   qm_web_admin_require_tls 1  refuse it over plaintext
#
# and it additionally honours the `webadmin` ACL scope, which understands CIDR:
#
#   quackcitadm.sh acl block webadmin '*'
#   quackcitadm.sh acl allow webadmin '10.0.0.0/8'
