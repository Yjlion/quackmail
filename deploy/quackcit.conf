# QuackCit server configuration, sourced by quackcit.sh and quackcitadm.sh.
#
# Copy this file, edit it, and point the scripts at it:
#     QUACKCIT_CONF=/etc/quackcit.conf quackcit.sh start
#
# Every assignment uses `: "${VAR:=value}"`, so a value already in the
# environment wins over the one here. That makes one-off overrides work:
#     QUACKCIT_PORT_SMTP=25 quackcit.sh start
#
# The scripts export everything set here, so anything they understand can be
# added below. No Python is involved: the server is the DuckDB CLI itself.

# ---- paths ----------------------------------------------------------------
#
# The scripts detect their install layout and default everything from it:
#
#   git checkout       extensions in build/release/extension/<n>/<n>.duckdb_extension,
#                      database, logs and runtime files beside them in the repo
#   unpacked release   everything flat in one directory (e.g. /opt/quackmail),
#                      with FHS state: /var/lib/quackcit, /var/log/quackcit,
#                      /run/quackcit
#
# To run an unpacked release without root, redirect all three at a writable
# directory — that is all it takes to keep an install self-contained:
#
# : "${QUACKCIT_STATE_DIR:=$HOME/.local/share/quackcit}"
# : "${QUACKCIT_LOG_DIR:=$HOME/.local/share/quackcit}"
# : "${QUACKCIT_RUN_DIR:=$HOME/.local/share/quackcit}"

# The DuckDB CLI that *is* the server. It must be the build the extensions were
# compiled against; the one shipped in the release bundle always is.
# : "${QUACKCIT_DUCKDB:=/opt/quackmail/duckdb}"

# Where the .duckdb_extension files live. Both a flat directory and the
# <name>/<name>.duckdb_extension tree that `make` emits are understood.
# : "${QUACKCIT_EXT_DIR:=/opt/quackmail}"

# Individual overrides, if the *_DIR defaults above are not enough.
# : "${QUACKCIT_DB:=/var/lib/quackcit/quackcit.duckdb}"    # back this up
# : "${QUACKCIT_LOG:=/var/log/quackcit/quackcit.log}"
# : "${QUACKCIT_ERRLOG:=/var/log/quackcit/quackcit.err}"   # SQL errors only
# : "${QUACKCIT_PIDFILE:=/run/quackcit/quackcit.pid}"

# The control channel. quackcitadm.sh uses it to reach a running server,
# because DuckDB permits only one read-write process per database file: the
# server reads its standard input from this FIFO for its whole life. It accepts
# arbitrary SQL, so treat it as a root-equivalent control channel — it is
# created mode 0600, and must not live on a shared filesystem.
# : "${QUACKCIT_ADMIN_FIFO:=/run/quackcit/control.fifo}"

# ---- the log ---------------------------------------------------------------

# quackcit.log is RFC 5424 syslog, one record per line:
#
#   <22>1 2026-07-28T15:41:02Z host quackcit 12345 listener - qm_http started
#
# The priority is this facility times eight plus the record's severity. Give a
# name (kern, user, mail, daemon, auth, syslog, lpr, news, uucp, cron,
# authpriv, ftp, local0..local7) or the number itself.
# : "${QUACKCIT_SYSLOG_FACILITY:=local0}"
#
# quackcit.err is deliberately *not* in that format, and should not be pointed
# at a collector: it is the control channel's error return path, and
# quackcitadm.sh reads a failed request's error text out of it byte for byte.
# Neither file is rotated.

# ---- site identity ---------------------------------------------------------

# The name this server calls itself: SMTP banners, Received: and Message-ID
# headers, the domain mail is accepted for, and the host the web interface
# redirects to. It is stored as the `c_fqdn` setting, so
# `quackcitadm.sh config get c_fqdn` shows what is in force.
#
# Left empty, the first start resolves it from `hostname -f` (then `hostname`,
# then localhost) and writes that — but only while c_fqdn is unset or still the
# `quackmail.test` placeholder the extension ships, so a name you chose is
# never overwritten. Set it here and it is authoritative: it is applied on
# every start.
# : "${QUACKCIT_FQDN:=mail.example.com}"

# ---- accounts created on first run -----------------------------------------

# One record per line: `<name> <password> <axlevel>`. Access level 6 is an aide
# (full administrative rights), 4 an ordinary user.
#
# A password of `-` is generated — 24 alphanumerics from openssl or
# /dev/urandom — and written to QUACKCIT_SEED_SECRET_FILE below. It is never
# printed to the terminal or the log; only the path is.
#
# This runs only while the database has no accounts at all, so it cannot reset
# a password later. Use `quackcitadm.sh user add` after that.
: "${QUACKCIT_SEED_USERS:=admin - 6}"

# Several accounts, mixing generated and chosen passwords:
#
# : "${QUACKCIT_SEED_USERS:=admin - 6
# alice - 4
# bob hunter2 4}"

# Where generated passwords are written, mode 0600, appended to. Delete it once
# the passwords have been changed.
# : "${QUACKCIT_SEED_SECRET_FILE:=/var/lib/quackcit/initial-credentials}"

# ---- network --------------------------------------------------------------

# Default bind address for every listener.
: "${QUACKCIT_HOST:=127.0.0.1}"

# Loopback by default because this one variable governs *every* listener, and
# 0.0.0.0 here would put SMTP, IMAP, POP3, NNTP and XMPP on the network too.
# To reach just the web interface from other machines, override that service
# alone — QUACKCIT_HOST_<KEY> exists for every key in the table below.
# : "${QUACKCIT_HOST_HTTP:=0.0.0.0}"
# : "${QUACKCIT_HOST_HTTPS:=0.0.0.0}"

# TLS material. Point these at a real certificate and its key — a Let's Encrypt
# fullchain.pem/privkey.pem pair works as-is — and every listener uses it. Set
# both or neither; a path that does not resolve stops the server from starting.
# : "${QUACKCIT_TLS_CERT:=/etc/ssl/certs/quackcit.pem}"
# : "${QUACKCIT_TLS_KEY:=/etc/ssl/private/quackcit.key}"

# With neither set, the first `quackcit.sh start` generates a self-signed pair
# below and uses that, so implicit-TLS listeners — SUBMISSIONS, POP3S, IMAPS,
# TELNETS, NNTPS, XMPPS and the HTTPS web interface — come up on a fresh install
# instead of being skipped. It is written once and reused by every restart
# afterwards, so a client that accepted the fingerprint keeps working. Nothing
# will trust it: it is a starting point, not a production certificate.
#
# Set this to 0 to opt out. Implicit-TLS listeners are then skipped unless you
# supply the certificate above, and STARTTLS is not offered.
# : "${QUACKCIT_TLS_AUTOGEN:=0}"

# Where that pair lives, and the name it is issued to. The subject defaults to
# `hostname -f` (then `hostname`, then localhost); the certificate always also
# carries localhost, 127.0.0.1 and ::1 as subject alternative names, which is
# what actually makes it usable against a dev box.
# : "${QUACKCIT_TLS_DIR:=/var/lib/quackcit/tls}"
# : "${QUACKCIT_TLS_CN:=mail.example.com}"

# ---- ports ----------------------------------------------------------------
#
# Defaults are the non-privileged dev ports, chosen so QuackCit can run beside
# a real Citadel server. Production values are in the trailing comments.

# Two listeners were renamed after the service they speak rather than the
# module behind them: SMTP_IN -> SMTP and SMTPS -> SUBMISSIONS (465 is
# submission-over-implicit-TLS, not "SMTP with TLS"). The old names are honoured
# for one release so an existing conf keeps working; they will go away.
[ -n "${QUACKCIT_PORT_SMTP_IN:-}" ] && : "${QUACKCIT_PORT_SMTP:=$QUACKCIT_PORT_SMTP_IN}"
[ -n "${QUACKCIT_PORT_SMTPS:-}" ] && : "${QUACKCIT_PORT_SUBMISSIONS:=$QUACKCIT_PORT_SMTPS}"
[ -n "${QUACKCIT_ENABLE_SMTP_IN:-}" ] && : "${QUACKCIT_ENABLE_SMTP:=$QUACKCIT_ENABLE_SMTP_IN}"
[ -n "${QUACKCIT_ENABLE_SMTPS:-}" ] && : "${QUACKCIT_ENABLE_SUBMISSIONS:=$QUACKCIT_ENABLE_SMTPS}"
[ -n "${QUACKCIT_HOST_SMTP_IN:-}" ] && : "${QUACKCIT_HOST_SMTP:=$QUACKCIT_HOST_SMTP_IN}"
[ -n "${QUACKCIT_HOST_SMTPS:-}" ] && : "${QUACKCIT_HOST_SUBMISSIONS:=$QUACKCIT_HOST_SMTPS}"

: "${QUACKCIT_PORT_CITADEL:=5040}"        # 504
: "${QUACKCIT_PORT_SMTP:=2525}"           # 25
: "${QUACKCIT_PORT_SUBMISSION:=2587}"     # 587
: "${QUACKCIT_PORT_SUBMISSIONS:=2465}"    # 465
: "${QUACKCIT_PORT_POP3:=1110}"           # 110
: "${QUACKCIT_PORT_POP3S:=1995}"          # 995
: "${QUACKCIT_PORT_IMAP:=1143}"           # 143
: "${QUACKCIT_PORT_IMAPS:=1993}"          # 993
: "${QUACKCIT_PORT_MANAGESIEVE:=4190}"    # 4190
: "${QUACKCIT_PORT_TELNET:=2300}"         # 23
: "${QUACKCIT_PORT_TELNETS:=2992}"        # 992
: "${QUACKCIT_PORT_NNTP:=1119}"           # 119
: "${QUACKCIT_PORT_NNTPS:=1563}"          # 563
: "${QUACKCIT_PORT_XMPP:=15222}"          # 5222
: "${QUACKCIT_PORT_XMPPS:=15223}"         # 5223

# The web interface (webmail, the BBS over the web, and the admin console).
# By default the plain listener only redirects to HTTPS; see the notes below.
: "${QUACKCIT_PORT_HTTP:=8080}"           # 80
: "${QUACKCIT_PORT_HTTPS:=8443}"          # 443

# LMTP does no authentication and no spam filtering by design — it is the
# trusted local-injection path. It binds to loopback regardless of
# QUACKCIT_HOST unless QUACKCIT_HOST_LMTP is set. Do not expose it.
: "${QUACKCIT_PORT_LMTP:=2033}"           # 24

# ---- which listeners to run -----------------------------------------------
#
# Set any of these to 0 to leave that service down.

# : "${QUACKCIT_ENABLE_XMPP:=0}"
# : "${QUACKCIT_ENABLE_NNTP:=0}"
# : "${QUACKCIT_ENABLE_TELNET:=0}"
# : "${QUACKCIT_ENABLE_HTTP:=0}"
# : "${QUACKCIT_ENABLE_HTTPS:=0}"

# ---- background workers ----------------------------------------------------
#
# The timer-driven half of the server. These bind nothing; each is a thread that
# wakes on an interval. Both are on by default, because with either one stopped
# the work still accumulates in the database and simply never leaves it.
#
#   RELAY     drains quackmail_outbound — every outbound message, including
#             submitted mail, alias forwards, Sieve redirects and mailing-list
#             copies. Turn this off and nothing is ever delivered off-site.
#   LISTSERV  distributes mailing lists: walks each list room for messages past
#             its watermark and queues a copy per subscriber, and builds digests.
#   FETCH     polls the POP3/IMAP mailboxes and RSS feeds configured with
#             `quackcitadm.sh feed` and posts what is new into a room. It does
#             nothing at all until a feed exists, so leaving it on costs
#             nothing; each feed has its own interval, and this is how often the
#             worker checks whether any of them is due.

# : "${QUACKCIT_ENABLE_RELAY:=0}"
# : "${QUACKCIT_ENABLE_LISTSERV:=0}"
# : "${QUACKCIT_ENABLE_FETCH:=0}"

# How often each wakes, in seconds.
# : "${QUACKCIT_INTERVAL_RELAY:=30}"
# : "${QUACKCIT_INTERVAL_LISTSERV:=60}"
# : "${QUACKCIT_INTERVAL_FETCH:=60}"

# Relay through a smarthost instead of delivering to each recipient's MX. Leave
# the host empty for direct-to-MX, which is what an internet-facing MTA wants.
: "${QUACKCIT_SMARTHOST_HOST:=}"
: "${QUACKCIT_SMARTHOST_PORT:=25}"
: "${QUACKCIT_SMARTHOST_USER:=}"
: "${QUACKCIT_SMARTHOST_PASS:=}"

# ---- the web interface -----------------------------------------------------
#
# These are rows in citadel_config, not environment variables — set them with
# `quackcitadm.sh config set <name> <value>`:
#
#   qm_web_force_https       the plain listener 301s everything to
#                            https://<c_fqdn>, with no port — so on the dev
#                            ports it redirects to a closed one. The first
#                            start therefore writes 0, and the web interface is
#                            served in the clear. Set it to 1 once you have a
#                            certificate clients trust, or are behind a reverse
#                            proxy listed in qm_web_trusted_proxies.
#   qm_web_trusted_proxies   '' comma-separated CIDRs/globs. X-Forwarded-Proto
#                               is honoured only from a peer on this list;
#                               without it a client could simply claim TLS.
#   qm_web_hsts              0  send Strict-Transport-Security over TLS. Opt-in
#                               because a wrong HSTS header is sticky.
#   qm_web_origins           '' comma-separated host globs allowed to submit
#                               forms. Empty means any origin may, which is
#                               what lets the interface work on whatever
#                               address you reach it at; the CSRF token is the
#                               defence either way. Set it to pin the form
#                               origin to a name you serve, e.g.
#                               `mail.example.com` or `*.example.com`.
#   qm_web_base_url          '' the absolute origin this server is reached at,
#                               e.g. `https://mail.example.com`. Only JMAP's
#                               Session resource needs one: a client calls
#                               apiUrl/uploadUrl/downloadUrl verbatim instead of
#                               resolving them against the request, so a path is
#                               not a URL there. Empty means "whatever the
#                               client's Host header said", which is right
#                               everywhere except behind a reverse proxy that
#                               rewrites it.
#   qm_web_sidebar_rooms     10 how many rooms with unread messages the sidebar
#                               lists, most unread first. The sidebar renders on
#                               every page, so this is the ceiling on what that
#                               costs; 0 drops the listing and the query behind
#                               it. Mail folder counts are unaffected — those
#                               are a handful of personal rooms either way.
#   qm_web_search_scan     2000 how many messages a *message text* search may
#                               read, newest first, per query. Subject and
#                               sender are columns and are matched in SQL with
#                               no cap; a body has to be decoded one message at
#                               a time, so that path is bounded and the page
#                               says when it hit the bound. Raise it on a small
#                               store, lower it on a busy one.
#   qm_http_max_connections 256 how many connections may be open at once,
#                               across both listeners. The web interface keeps
#                               connections alive (a page is several requests
#                               once its stylesheet and script are counted), and
#                               each open connection costs a thread, so this is
#                               the ceiling that keeps that bounded. 0 means
#                               unlimited, which is not recommended on anything
#                               reachable from outside. Read once at load, so a
#                               change needs a restart.
#
# Rooms can be handed out without handing out the console. A room's settings
# page is gated on the RFC 4314 `a` right, so
#
#   quackcitadm.sh room acl 'Project X' alice lrswia
#
# makes alice that room's administrator and nothing else. She can then set its
# name, flags and access list, open or close its room_<name>@ address, and run
# its mailing list — but not create a feed, make a room into a list, or reach
# /admin. `quackcitadm.sh room rights 'Project X' alice` shows what she may
# actually do, derived from the room's own attributes plus the stored grants.
#
#   qm_room_create_axlevel   6  the access level that may create rooms of its
#                               own at /bbs/new. Aide by default, so nothing
#                               changes until you lower it; whoever creates a
#                               room administers it. A value that is not a
#                               number in 0-6 is read as the default, so a typo
#                               cannot open the door.
#
# The admin console can set config, mint credentials and generate DKIM keys, so
# it is root-equivalent and ships turned off:
#
#   qm_web_admin_enabled     0  turn the console on
#   qm_web_admin_require_tls 1  refuse it over plaintext
#
# and it additionally honours the `webadmin` ACL scope, which understands CIDR:
#
#   quackcitadm.sh acl block webadmin '*'
#   quackcitadm.sh acl allow webadmin '10.0.0.0/8'
