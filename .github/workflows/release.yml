name: Release

# Build the QuackMail DuckDB extensions and publish them as installable release
# assets. Pushing a version tag (e.g. `v0.1.0`) cuts a GitHub Release; a manual
# run just builds and uploads a workflow artifact so the pipeline can be tested
# without tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Required so `gh release create` can attach assets to a Release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package (linux_amd64)
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev ccache

      - name: Resolve versions
        id: vers
        run: |
          set -euo pipefail
          # The extension metadata must be stamped with the DuckDB version the
          # submodule is pinned to; the submodule is a shallow checkout without
          # tags, so `git describe` would otherwise fall back to v0.0.1 and the
          # extensions would refuse to load. Feed the pinned version to DuckDB's
          # OVERRIDE_GIT_DESCRIBE instead of fetching tags.
          duckdb_version="$(git config -f .gitmodules submodule.duckdb.branch)"
          echo "duckdb_version=${duckdb_version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release="${GITHUB_REF_NAME}"
          else
            release="dev-$(git rev-parse --short HEAD)"
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "Building QuackCit ${release} against DuckDB ${duckdb_version}"

      # These extensions use DuckDB's *internal* C++ API (ExtensionLoader,
      # TableFunction, MaterializedQueryResult, ...), whose headers ship only in
      # the DuckDB source tree — not in the released libduckdb amalgamation — so
      # DuckDB cannot be swapped for a downloaded binary; it must be compiled
      # from the pinned submodule. ccache makes that a one-time cost: DuckDB's
      # CMake auto-detects ccache, so after the first run its ~unchanged object
      # files are reused and only our extension sources recompile.
      - name: Cache DuckDB compilation (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-amd64-duckdb-${{ steps.vers.outputs.duckdb_version }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-amd64-duckdb-${{ steps.vers.outputs.duckdb_version }}-
            ccache-linux-amd64-duckdb-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      - name: Build extensions
        env:
          OVERRIDE_GIT_DESCRIBE: ${{ steps.vers.outputs.duckdb_version }}
        run: make

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Run tests
        run: make test

      - name: Package artifacts
        id: pkg
        env:
          REL: ${{ steps.vers.outputs.release }}
          DUCKDB_VERSION: ${{ steps.vers.outputs.duckdb_version }}
        run: |
          set -euo pipefail
          bundle="quackmail-${REL}-linux_amd64"
          out="dist/${bundle}"
          mkdir -p "${out}"

          # The loadable extensions (original names, so `LOAD` is simple).
          for ext in quackmail quackmail_citadel quackmail_smtp_in quackmail_smtp_out \
                     quackmail_imap quackmail_managesieve quackmail_pop3 \
                     quackmail_telnet quackmail_nntp quackmail_xmpp quackmail_http \
                     quackmail_spool; do
            cp "build/release/extension/${ext}/${ext}.duckdb_extension" "${out}/"
          done

          # A batteries-included DuckDB CLI with everything statically linked,
          # so the bundle runs a mail server with no separate DuckDB install.
          cp build/release/duckdb "${out}/duckdb"
          cp README.md "${out}/"

          # The run/admin scripts. They are POSIX shell and drive the DuckDB CLI
          # above directly — nothing else has to be installed to run a server.
          # They detect this flat layout and find the extensions beside them.
          cp deploy/quackcit.sh deploy/quackcitadm.sh deploy/quackcit_common.sh \
             deploy/quackcit.conf deploy/quackcit.service "${out}/"
          chmod +x "${out}/quackcit.sh" "${out}/quackcitadm.sh"

          cat > "${out}/INSTALL.md" <<EOF
          # QuackMail ${REL} (linux_amd64)

          A statically linked DuckDB ${DUCKDB_VERSION} CLI, the unsigned
          loadable extensions built against it, and the scripts that run them as
          a server. Everything works from this one directory; no Python and no
          separate DuckDB install.

          ## Option A — run it as a server

          \`\`\`bash
          sudo tar -xzf quackmail-${REL}-linux_amd64.tar.gz -C /opt
          sudo mv /opt/quackmail-${REL}-linux_amd64 /opt/quackmail

          sudo /opt/quackmail/quackcit.sh start
          sudo /opt/quackmail/quackcit.sh status
          sudo /opt/quackmail/quackcitadm.sh user add alice s3cret
          \`\`\`

          Settings live in \`quackcit.conf\` (copy it to \`/etc/quackcit.conf\`
          and point \`QUACKCIT_CONF\` at it). Out of the box every listener binds
          127.0.0.1 on a non-privileged port; the database goes to
          \`/var/lib/quackcit\`, logs to \`/var/log/quackcit\` and the control
          FIFO to \`/run/quackcit\`. To run without root, set
          \`QUACKCIT_STATE_DIR\`, \`QUACKCIT_LOG_DIR\` and \`QUACKCIT_RUN_DIR\`
          to somewhere writable. \`quackcit.service\` is a systemd unit template.

          The first start also generates a self-signed certificate under
          \`/var/lib/quackcit/tls\` if you have none, so the TLS listeners — the
          HTTPS web interface included — come up immediately. No client will
          trust it; point \`QUACKCIT_TLS_CERT\` and \`QUACKCIT_TLS_KEY\` at real
          material when you have it.

          ## Option B — drive DuckDB yourself

          \`\`\`bash
          ./duckdb -unsigned
          \`\`\`
          \`\`\`sql
          LOAD './quackmail.duckdb_extension';        -- umbrella: schema + users
          LOAD './quackmail_citadel.duckdb_extension';
          CALL qm_user_add('alice', 'secret');
          CALL cit_start('127.0.0.1', 5040);          -- native Citadel protocol
          \`\`\`

          The same extensions load into your own DuckDB ${DUCKDB_VERSION} build,
          which must be that exact version, started with \`-unsigned\` (or
          \`SET allow_unsigned_extensions=true;\`).

          Extensions: quackmail (umbrella), quackmail_citadel (native Citadel
          protocol), quackmail_smtp_in, quackmail_smtp_out, quackmail_imap,
          quackmail_managesieve, quackmail_pop3, quackmail_telnet,
          quackmail_nntp, quackmail_xmpp, quackmail_http (webmail + admin).
          EOF

          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          ( cd dist && sha256sum "${bundle}.tar.gz" > "${bundle}.tar.gz.sha256" )
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.bundle }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ steps.vers.outputs.release }}
          DUCKDB_VERSION: ${{ steps.vers.outputs.duckdb_version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          QuackCit ${REL} — a Citadel groupware/BBS server that runs inside
          DuckDB, as loadable extensions (also speaks SMTP/IMAP/POP3). Built
          against DuckDB ${DUCKDB_VERSION} for **linux_amd64**.

          ## Install

          The bundle is self-contained: a statically linked DuckDB CLI, the
          extensions, and POSIX shell scripts that run them as a server. No
          Python, no separate DuckDB.

          \`\`\`bash
          sudo tar -xzf quackmail-${REL}-linux_amd64.tar.gz -C /opt
          sudo mv /opt/quackmail-${REL}-linux_amd64 /opt/quackmail

          sudo /opt/quackmail/quackcit.sh start
          sudo /opt/quackmail/quackcitadm.sh user add alice s3cret
          \`\`\`

          Every listener binds 127.0.0.1 on a non-privileged port by default;
          edit \`quackcit.conf\` to change that. \`quackcit.service\` is a
          systemd unit template. To drive DuckDB by hand instead, run
          \`./duckdb -unsigned\` and \`LOAD './quackmail.duckdb_extension';\` —
          unsigned extensions require the \`-unsigned\` flag (or
          \`SET allow_unsigned_extensions=true;\`).

          See \`INSTALL.md\` in the bundle. Verify the download with the
          accompanying \`.sha256\` file.
          EOF

          tarball="dist/quackmail-${REL}-linux_amd64.tar.gz"
          # Idempotent publish: if the release already exists (e.g. it was created
          # from the GitHub UI, which is what pushed this tag), attach/refresh the
          # assets instead of failing on a duplicate `gh release create`.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${tarball}" "${tarball}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${tarball}" "${tarball}.sha256" \
              --title "QuackCit ${REL}" \
              --notes-file release-notes.md
          fi
